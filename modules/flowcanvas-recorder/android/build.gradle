apply plugin: 'com.android.library'

group = 'expo.modules.flowcanvasrecorder'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()

def getExtOrDefault(name, defaultValue) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
}

android {
  namespace "expo.modules.flowcanvasrecorder"
  compileSdk getExtOrDefault("compileSdkVersion", 35)

  defaultConfig {
    minSdk getExtOrDefault("minSdkVersion", 24)
    targetSdk getExtOrDefault("targetSdkVersion", 35)
    versionCode 1
    versionName "1.0.0"
  }

  lintOptions {
    abortOnError false
  }
}
